name: Finance Pro Foundation Validation

on:
  push:
    branches: [main, 'foundation/**']
  pull_request:
    branches: [main]

jobs:
  sql-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_pro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance_pro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate PostgreSQL foundation and sync engine
        env:
          PGPASSWORD: postgres
        run: |
          for file in \
            backend/database/sql/postgresql/001_foundation.sql \
            backend/database/sql/postgresql/002_sync_engine.sql \
            backend/database/sql/postgresql/003_sync_concurrency.sql
          do
            psql -h localhost -U postgres -d finance_pro_test -v ON_ERROR_STOP=1 -f "$file"
          done

  sqlite-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SQLite foundation
        run: |
          sqlite3 :memory: <<'SQL'
          PRAGMA foreign_keys = ON;
          .read desktop/database/sqlite/001_foundation.sql
          SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;
          SQL

  backend-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_pro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance_pro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: finance_pro_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Validate Composer manifest
        working-directory: backend
        run: composer validate --no-check-publish --strict
      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: PHP syntax validation
        run: |
          find backend/app backend/tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run PHPUnit suite
        working-directory: backend
        run: vendor/bin/phpunit --testdox
      - name: Run PostgreSQL concurrency test
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d finance_pro_test -v ON_ERROR_STOP=1 \
            -f backend/database/sql/postgresql/001_foundation.sql
          psql -h 127.0.0.1 -U postgres -d finance_pro_test -v ON_ERROR_STOP=1 \
            -f backend/database/sql/postgresql/002_sync_engine.sql
          psql -h 127.0.0.1 -U postgres -d finance_pro_test -v ON_ERROR_STOP=1 \
            -f backend/database/sql/postgresql/003_sync_concurrency.sql

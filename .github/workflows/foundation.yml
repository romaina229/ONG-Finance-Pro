name: Finance Pro Foundation Validation

on:
  push:
    branches: [main, 'foundation/**']
  pull_request:
    branches: [main]

jobs:
  sql-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_pro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance_pro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate PostgreSQL foundation
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d finance_pro_test -v ON_ERROR_STOP=1 -f backend/database/sql/postgresql/001_foundation.sql
          psql -h localhost -U postgres -d finance_pro_test -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM organizations;"

  sqlite-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SQLite foundation
        run: |
          sqlite3 :memory: <<'SQL'
          PRAGMA foreign_keys = ON;
          .read desktop/database/sqlite/001_foundation.sql
          SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;
          SQL
